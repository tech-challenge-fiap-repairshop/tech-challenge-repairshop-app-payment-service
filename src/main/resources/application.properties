spring.application.name=payment-service
server.port=8082

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Logging Pattern (W3C OpenTelemetry Correlation)
logging.pattern.level=%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}]

# Actuator & Probes K8s (PF-11)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.probes.enabled=true

# Readiness Probe Group
management.endpoint.health.group.readiness.include=readinessState

# Liveness Probe Group (Self-Healing para SQS Listeners)
management.endpoint.health.group.liveness.include=livenessState,sqsListener

# SQS Health Check Parameters
payment.sqs.health-check.enabled=${SQS_HEALTH_CHECK_ENABLED:true}
payment.sqs.health-check.max-idle-seconds=${SQS_HEALTH_CHECK_MAX_IDLE:120}

# SQS Queues - Fase 4 Oficiais (tech-challenge-repairshop-infra-sqs)
sqs.queue.os-ready-for-payment=${SQS_OS_READY_FOR_PAYMENT:os-ready-for-payment-queue-dev}
sqs.queue.payment-notification=${SQS_PAYMENT_NOTIFICATION:payment-notification-queue-dev}
sqs.queue.payment-success=${SQS_PAYMENT_SUCCESS:payment-success-queue-dev}

# DynamoDB Table - Fase 4 Oficial (tech-challenge-repairshop-infra-db-dynamo)
dynamodb.table.payment=${DYNAMODB_TABLE_PAYMENT:tb-payment-dev}

# Scheduler oficial: scheduler_os_payment_atualization (15 minutos = 900.000 ms)
scheduler.os-payment.delay=${SCHEDULER_PAYMENT_DELAY:900000}

# Resilience4j Circuit Breaker Config (Mercado Pago)
resilience4j.circuitbreaker.instances.mercadoPagoCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.mercadoPagoCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.mercadoPagoCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mercadoPagoCircuitBreaker.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.mercadoPagoCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
