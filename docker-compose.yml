services:
  localstack:
    image: localstack/localstack:latest
    container_name: payment-localstack
    environment:
      - SERVICES=dynamodb,sqs
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build: .
    container_name: payment-service-standalone
    environment:
      SERVER_PORT: 8082
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      DYNAMODB_TABLE_PAYMENT: tb-payment-dev
      SQS_QUEUE_CREATE_PAYMENT: create-payment-order-queue-dev
      SQS_QUEUE_CALLBACK_PAYMENT: callback-payment-order-queue-dev
      SQS_QUEUE_PAYMENT_NOTIFICATION: payment-notification-queue-dev
      # OpenTelemetry
      OTEL_SERVICE_NAME: payment-service
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: prometheus
      OTEL_LOGS_EXPORTER: none
    ports:
      - "8082:8082"
    depends_on:
      localstack:
        condition: service_healthy
