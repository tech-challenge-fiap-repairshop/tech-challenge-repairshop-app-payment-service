apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: repairshop
  labels:
    app: payment-service
    env: dev
data:
  SPRING_APPLICATION_NAME: payment-service
  SERVER_PORT: "8082"
  SPRING_PROFILES_ACTIVE: dev
  AWS_REGION: us-east-1
  DYNAMODB_TABLE_NAME: tb-payment-dev
  SQS_CREATE_PAYMENT_ORDER_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/000000000000/create-payment-order-queue-dev
  SQS_SERVICE_ORDER_EXECUTION_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/000000000000/service-order-execution-queue-dev
  SQS_PAYMENT_NOTIFICATION_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/000000000000/payment-notification-queue-dev
  SQS_HEALTH_CHECK_ENABLED: "true"
  SQS_HEALTH_CHECK_MAX_IDLE: "120"
  LOGGING_LEVEL_BR_COM_FIAP_REPAIRSHOP_PAYMENT: DEBUG
